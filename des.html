<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bX Team</title>
    
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #0b1220;
    color: #fff;
}

header {
    background: #1a1f2b;
    padding: 20px;
    text-align: center;
}

nav ul {
    list-style: none;
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 10px;
}

nav a {
    text-decoration: none;
    color: #fff;
    transition: 0.3s;
}

nav a:hover {
    color: cyan;
}

main {
    padding: 40px;
    text-align: center;
}

footer {
    background: #1a1f2b;
    text-align: center;
    padding: 10px;
    margin-top: 40px;
}

#a1h1 {
    color: rgb(134, 134, 35);
}

#b1h1 {
    color: rgb(15, 83, 208);
}


/* Sosial media dizaynı */

#b2h2 {
    color: rgb(183, 183, 183);
}

.social-media {
    text-align: center;
    margin: 30px 0;
}

.social-media h2 {
    margin-bottom: 15px;
    color: #222;
}

.social-links {
    display: flex;
    justify-content: center;
    gap: 18px;
}

.social-icon {
    display: inline-block;
    padding: 10px 18px;
    border-radius: 6px;
    color: #fff;
    text-decoration: none;
    font-weight: 500;
    transition: background 0.2s, transform 0.2s;
}

.social-icon.discord {
    background: #1b4296;
}

.social-icon.github {
    background: #706a6a;
}

.social-icon.youtube {
    background: #ba2d2d;
}

.social-icon:hover {
    transform: translateY(-3px) scale(1.05);
    opacity: 0.9;
}


/* Contact bölməsi üçün dizayn */

.contact-section {
    max-width: 500px;
    margin: 40px auto;
    padding: 30px;
    background: #f9f9f9;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

.contact-section h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #222;
}

.contact-form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.contact-form label {
    font-weight: 500;
    color: #333;
}

.contact-form input,
.contact-form textarea {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 1rem;
    resize: vertical;
}

.contact-form button {
    background: #222;
    color: #fff;
    border: none;
    padding: 12px;
    border-radius: 6px;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s;
}

.contact-form button:hover {
    background: #444;
}

#c1h1 {
    color: rgb(253, 249, 238);
}


/* Blog kartı üçün əlavə dizayn */


/* filepath: c:\Users\bexti\OneDrive\Desktop\baxa site\css\style.css */


/* Ana səhifə üçün şəkil və mətn yanaşı dizayn */


/* filepath: c:\Users\bexti\OneDrive\Desktop\baxa site\css\style.css */

#playBtn {
    display: block;
    margin: 20px auto;
    background-color: #28a745;
    color: white;
    font-size: 26px;
    font-weight: bold;
    padding: 6px 70px;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    box-shadow: 0 5px #1c7430;
    transition: all 0.3s ease;
}

#playBtn:hover {
    background-color: #218838;
    transform: translateY(-2px);
    box-shadow: 0 7px #1c7430;
}

#playBtn:active {
    transform: translateY(1px);
    box-shadow: 0 3px #1c7430;
}

.main-hero {
    display: flex;
    align-items: center;
    justify-content: left;
    gap: 90px;
    margin-bottom: 40px;
}

.hero-image {
    width: 700px;
    height: 442px;
    object-fit: contain;
    border-radius: 18px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
    background: #222;
}

.hero-text {
    text-align: left;
    max-width: 400px;
}

@media (max-width: 900px) {
    .main-hero {
        flex-direction: column;
        gap: 24px;
    }
    .hero-text {
        text-align: center;
    }
}
    </style>
